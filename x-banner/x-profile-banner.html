<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1500, height=500, initial-scale=1">
    <title>Hiro App Works X Profile Banner</title>
    <link rel="stylesheet" href="./x-profile-banner.css">
  </head>
  <body>
    <main class="x-banner" aria-label="Hiro App Works Xプロフィールバナー">
      <header class="x-header">
        <span class="brand-mark-shell" aria-hidden="true">
          <img src="../assets/brand/hiro-app-works-mark.svg" alt="" width="26" height="27">
        </span>
        <span>Hiro App Works</span>
      </header>

      <section class="x-hero-copy" aria-labelledby="x-banner-title">
        <p class="x-brand-label">Hiro App Works</p>
        <h1 id="x-banner-title">
          <span>日々の小さな面倒を、</span>
          <span>シンプルなアプリに。</span>
        </h1>
        <p class="x-description">
          <span>iPhoneを、もう少し便利に。</span>
          <span>小さな課題に寄り添うアプリをつくっています。</span>
        </p>
      </section>

      <section class="x-product" aria-label="委託販売ノート">
        <div class="x-product-label">
          <img src="../assets/apps/consignment-note/app-icon.webp" alt="" width="512" height="512">
          <div>
            <span>APP 01</span>
            <strong>委託販売ノート</strong>
          </div>
        </div>

        <div class="phone-stage" aria-hidden="true">
          <span class="phone-orbit phone-orbit-one"></span>
          <span class="phone-orbit phone-orbit-two"></span>
          <div class="app-preview-frame">
            <div class="app-preview-screen">
              <img src="../assets/apps/consignment-note/screens/home.webp" alt="" width="660" height="1434">
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
